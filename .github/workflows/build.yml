name: Build APK

# 触发：推送 v* 标签（自动发布）或手动运行
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受 SDK 许可
        run: yes | sdkmanager --licenses || true

      - name: 构建 APK
        run: ./gradlew assembleDebug

      - name: 重命名产物
        run: mv app/build/outputs/apk/debug/app-debug.apk pickup-code-grabber-debug.apk

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: pickup-code-grabber-debug
          path: pickup-code-grabber-debug.apk

      - name: 发布到 GitHub Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pickup-code-grabber-debug.apk
          generate_release_notes: true
          body: |
            由 GitHub Actions 自动构建（tag: ${{ github.ref_name }}）。

            > 注意：此 APK 为 debug 签名，正式分发建议由维护者使用生产 keystore 签名后替换。
