name: Build APK

# 触发：推送 v* 标签 或 手动运行
# 职责：构建验证 + 产出（debug 签名）测试 APK 供下载体验；
#       正式分发 APK 由维护者用生产 keystore 签名后经标准发布流程挂载（见 docs/RELEASE-PROCESS.md）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受 SDK 许可
        run: yes | sdkmanager --licenses || true

      - name: 构建 APK
        run: ./gradlew assembleDebug

      - name: 重命名产物
        run: mv app/build/outputs/apk/debug/app-debug.apk pickup-code-grabber-debug.apk

      - name: 上传构建产物（仅测试用）
        uses: actions/upload-artifact@v4
        with:
          name: pickup-code-grabber-debug
          path: pickup-code-grabber-debug.apk
