name: Build APK

# 触发：推送 v* 标签 或 手动运行
# 职责：构建验证 + 产出（debug 签名）测试 APK 供下载体验；
#       正式分发 APK 由维护者用生产 keystore 签名后经标准发布流程挂载（见 docs/RELEASE-PROCESS.md）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 注意：setup-android v3 的默认 packages 是 'tools platform-tools'，
      # 而 SDK 仓库早已移除 legacy 'tools' 包 → sdkmanager 以 exit code 1 退出
      # （报错 "Failed to find package 'tools'"），job 会在这一步直接失败、Gradle 根本跑不到。
      # runner 镜像本身自带 Android SDK，这里只需要 platform-tools。
      - name: ColorOS 门禁类静态检测回归
        run: sh tools/test_coloros_gate.sh

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: 接受 SDK 许可
        run: yes | sdkmanager --licenses || true

      - name: 安装编译所需 SDK 组件
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: 开关交互回归与 APK 构建
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleDebug
          python3 tools/check_modern_apk.py app/build/outputs/apk/debug/app-debug.apk

      - name: 重命名产物
        run: mv app/build/outputs/apk/debug/app-debug.apk pickup-code-grabber-debug.apk

      - name: 上传构建产物（仅测试用）
        uses: actions/upload-artifact@v4
        with:
          name: pickup-code-grabber-debug
          path: pickup-code-grabber-debug.apk

      - name: 上传单元测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: switch-interaction-tests
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
