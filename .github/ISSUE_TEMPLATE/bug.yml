name: 🐛 问题反馈
description: 取件码没抓到、识别错误、写入失败等问题反馈
title: "[bug] "
labels: ["bug"]
body: |
  感谢反馈！为了能快速定位，麻烦按下面补充信息。

  ## 1. 问题类型

  - [ ] 该抓没抓到（漏抓）
  - [ ] 抓错了（提取了错误的码 / 来源 / 地点）
  - [ ] 抓到了但没写进待办
  - [ ] 写进待办了但格式不对
  - [ ] App 打不开 / 崩溃
  - [ ] 其他

  ## 2. 短信原文

  > ⚠️ **请务必自行脱敏**：姓名、手机号、住址、门牌号请先处理
  > （如 `李女士 138****5678` → `李女士 <手机号已脱敏>`）
  > 未脱敏的内容可能被关闭，不影响问题跟踪。

  ```
  【XX驿站】您的包裹已到站，取件码为...
  ```

  ## 3. 期望结果

  <!-- 应该提取到什么？取件码 / 来源 / 地点分别是什么 -->

  ## 4. 实际结果

  <!-- App 实际写出了什么？或完全没反应？ -->

  ```
  例：写成了「📦 取件码 6｜拼多多｜—｜2026-09-16 15:01」
  ```

  ## 5. 运行环境

  - 模块版本：`v____`（App 首页副标题可见）
  - 规则集版本：`v____`（设置页体检行可见，如「规则集: v4」）
  - 手机型号：`____`
  - 系统版本：`HyperOS ____ / ColorOS ____ / 其他 ____`
  - 通知取件提取：开启 / 关闭

  ## 6. 复现步骤

  1. 收到上述短信
  2. 打开 App 查看
  3. 发现如上问题

  ## 7. 补充说明（可选）

  <!--
  💡 更快的方式：App 右上角 ⋮ → 📋 疑似漏抓错题本 → 📋 复制全部上报文本
  （已自动脱敏，可直接粘贴到这里）
  -->
