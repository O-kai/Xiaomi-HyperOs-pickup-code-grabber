name: 🧩 提交自定义规则
description: 把你为自家驿站/学校自提柜写的规则贡献给官方（经人工审核后会随规则热更新下发给所有用户）
title: "[user-rule] 规则名："
labels: ["user-rule"]
body: |
  ## ⚠️ 提交前必读

  1. **必须自行脱敏**：短信样本里的姓名、手机号、住址、门牌号请先处理
     （如 `张先生 138****1234` → `张先生 <手机号已脱敏>`）。
     未脱敏的样本会被直接关闭，不会进入审核流程。
  2. **规则不会自动入库**：官方规则是全网无差别下发的，
     每条提交都会经过 **人工审核 + 全量回归（38 条基线）**，通过后才会合并。
  3. **只提交"提取规则"**：本功能只能定义「从短信里提取取件码/来源/地点」，
     不涉及也无法涉及任何数据库写入行为。

  ---

  ## 1. 规则名称

  <!-- 例：我们小区菜鸟驿站 / XX大学自提柜 -->

  ## 2. 适用场景说明

  <!--
  为什么要单独写这条规则？官方规则集哪里没覆盖到？
  例：学校自提柜的文案是「物品编号 XZ-77612」，官方词表里没有这种说法
  -->

  ## 3. 发送方范围

  <!--
  填匹配方式 + 值，或勾选「不限来源」
  □ 不限来源（全局规则）
  □ 精确匹配（固定号码）：__________
  □ 前缀匹配（虚拟号，后几位随机）：__________
  □ 包含匹配（号码含文字）：__________
  -->

  ## 4. 规则文本

  <!--
  直接粘贴 App 内「📤 导出分享」生成的文本即可，无需手写
  -->

  ```
  ## 在此粘贴导出的规则文本
  ```

  ## 5. 短信样本（已脱敏）

  <!--
  ⚠️ 请确认每条样本都已脱敏
  建议 1-3 条，覆盖不同情形（如有多个码、带尾号、含特殊符号等）
  -->

  ```
  例：【XX大学自提柜】同学您好，您本次的物品编号 XZ-77612 已放置在 A 栋 3 楼取件口
  ```

  ## 6. 自测结果

  <!--
  App 内点「🧪 自测并保存」的结果截图或描述
  例：自测通过（3/3），耗时均低于 50ms 熔断阈值
  -->

  ## 7. 补充说明（可选）

  <!-- 其他你认为维护者应该知道的信息 -->
