# Single source of truth for Android versioning.
#
# 两个字段各管一件事（保持简单，不要再引入推导规则）：
#   VERSION_NAME —— 给人看的点分版本号，界面上一律显示 V + 它（如 V4.0.2）
#   VERSION_CODE —— Android 内部用的整数，必须单调递增，只用于升级判定
#                   与规则集的 minAppVersionCode 兼容性闸门，不参与展示
#
# 版本语义（用户定义）：
#   第一段 = 大版本   （4）
#   第二段 = 小版本   （加功能，0 / 1 / 2 …）
#   第三段 = 修复版本 （修 bug，0 / 1 / 2 …）
VERSION_NAME=4.0.5
VERSION_CODE=405
