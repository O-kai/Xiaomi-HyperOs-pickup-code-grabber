# =============================================================================
#  版本号唯一事实源（4.0.2 起）
# ----------------------------------------------------------------------------
#  这里只写一个东西：VERSION_NAME，点分三段式。
#
#  格式与语义（用户定义，后续一律照此，不再各写各的）：
#      V<大版本>.<小版本>.<修复版本>
#      第一段 = 大版本：不兼容的架构/功能变更时 +1，例 3 → 4
#      第二段 = 小版本：新增功能时 +1，例 4.0.0 → 4.1.0
#      第三段 = 修复版本：修 bug 时 +1，例 4.1.0 → 4.1.1
#
#  例：
#      4.0.0  第四个大版本的第一个正式版
#      4.1.0  加了新功能（如小组件显示模式）
#      4.1.1  修 bug
#
#  为什么不再单独维护 versionCode：
#  原先 VERSION_NAME 与 VERSION_CODE 是两个独立数字，改一处忘另一处就会出现
#  「界面显示 4.0.0 但规则兼容性按 293 判」这类说不清的问题。
#  现在 VERSION_CODE 由本文件按固定公式推导（见 app/build.gradle）：
#      major * 10000 + minor * 100 + patch
#  例：4.0.0 → 40000；4.1.0 → 40100；4.1.1 → 40101
#  规则集的 minAppVersionCode 也用同一套数字，与此保持一致。
#
#  注意：不要再加 -internal / -rc2 之类的后缀。
#  内部开发版直接改这里的数字即可（4.0.1 → 4.0.2 → 4.1.0），
#  后缀会让版本比较与展示都多一层容错逻辑，是历史包袱而非需求。
# =============================================================================
VERSION_NAME=4.0.2
