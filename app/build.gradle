plugins {
    id 'com.android.application'
}

// =============================================================================
//  版本号唯一事实源：<repo>/version.properties
// ----------------------------------------------------------------------------
//  两个字段各管一件事，不做推导、不做换算：
//      VERSION_NAME  = 4.0.2   给人看的点分版本号，界面显示 V + 它
//      VERSION_CODE  = 402     Android 内部整数，单调递增，只用于升级判定
//                               与规则集 minAppVersionCode 兼容性闸门
//
//  为什么保持两个独立数字而不是由一个推导另一个：
//  推导方案（major*10000+minor*100+patch）改动的是整个版本体系的骨架，
//  连带要动规则闸门、历史标签、文档基线；而 App 里真正需要「点分版本号」
//  的只是展示层，历史版本也早已不再带 -internal 之类后缀。
//  维持简单更不容易出错——一个字段只表达一件事，改一处不会牵连另一处。
// =============================================================================
def versionFile = rootProject.file('version.properties')
if (!versionFile.exists()) {
    throw new GradleException("Missing version.properties at ${versionFile}")
}
def versionProps = new Properties()
versionFile.withInputStream { versionProps.load(it) }
def pickupVersionCode = versionProps.getProperty('VERSION_CODE')?.toInteger()
def pickupVersionName = versionProps.getProperty('VERSION_NAME')
if (pickupVersionCode == null || pickupVersionName == null || pickupVersionName.trim().isEmpty()) {
    throw new GradleException("version.properties must define VERSION_CODE and VERSION_NAME")
}


// ============================================================================
//  规则单源（v4.0）
// ----------------------------------------------------------------------------
//  rules/rules.json 是【唯一】需要人工维护的规则文件。
//  构建时由本任务生成两份派生产物：
//    1. app/build/generated/rules/java/.../GeneratedRules.java
//       —— 内置默认规则（系统进程没有 Context，只能读编译进代码的这份）
//    2. app/build/generated/rules/assets/rules/rules.json
//       —— APK 内置兜底（App 进程读 assets 时用）
//  之前这三份要手工同步，漏改 Java 副本时系统进程会一直跑旧规则且毫无提示。
// ============================================================================
def rulesSourceFile = rootProject.file('rules/rules.json')
def rulesGenRoot = layout.buildDirectory.dir('generated/rules')
def rulesGenJavaDir = rulesGenRoot.map { it.dir('java') }
def rulesGenAssetsDir = rulesGenRoot.map { it.dir('assets') }

tasks.register('generateRules') {
    group = 'build'
    description = 'Generate the embedded rules asset + Java constant from rules/rules.json.'
    inputs.file(rulesSourceFile)
    outputs.dir(rulesGenRoot)
    doLast {
        if (!rulesSourceFile.exists()) {
            throw new GradleException("Missing rules source: ${rulesSourceFile}")
        }
        def raw = rulesSourceFile.getText('UTF-8')
        def parsed = new groovy.json.JsonSlurper().parseText(raw)
        if (!parsed.containsKey('version') || !parsed.containsKey('dashPattern')) {
            throw new GradleException('rules/rules.json must define version and dashPattern')
        }

        // Java 字符串字面量转义
        def escStr = { String s ->
            return s.replace('\\', '\\\\').replace('"', '\\"')
                    .replace('\r', '\\r').replace('\n', '\\n').replace('\t', '\\t')
        }
        // 数组字面量
        def escArray = { String key ->
            def arr = parsed[key] ?: []
            return arr.collect { '"' + escStr(it.toString()) + '"' }.join(', ')
        }

        def sb = new StringBuilder()
        sb.append('package io.github.okaidev.pickupcode;\n\n')
        sb.append('/**\n')
        sb.append(' * 【自动生成，请勿手工编辑】由构建任务 generateRules 从 rules/rules.json 生成。\n')
        sb.append(' *\n')
        sb.append(' * <p>规则集的唯一事实源是仓库根目录的 rules/rules.json；\n')
        sb.append(' * 本文件与 APK assets 里的那份都是它的派生产物。\n')
        sb.append(' *\n')
        sb.append(' * <p>这里刻意【不用 JSON 内嵌字符串】而是生成类型化字段：\n')
        sb.append(' * 系统进程（system_server / telephony）没有 Context，只能读编译进来的这份；\n')
        sb.append(' * 而 JVM 上的单元测试用的 android.jar 里 org.json 只是空壳（调用即抛 Stub!），\n')
        sb.append(' * 内置默认走 JSON 解析会让整套回归测试在离线环境里直接失效。\n')
        sb.append(' */\n')
        sb.append('public final class GeneratedRules {\n')
        sb.append('    private GeneratedRules() { }\n\n')
        sb.append('    public static final int VERSION = ' + parsed.version + ';\n')
        sb.append('    public static final int MIN_APP_VERSION_CODE = ' + parsed.minAppVersionCode + ';\n')
        sb.append('    public static final String DESCRIPTION = "' + escStr(parsed.description ?: '') + '";\n')
        sb.append('    public static final String DASH_PATTERN = "' + escStr(parsed.dashPattern ?: '') + '";\n')
        sb.append('    public static final String ALNUM_PATTERN = "' + escStr(parsed.alnumPattern ?: '') + '";\n\n')
        def arrays = [
                ['FEATURE_WORDS', 'featureWords'],
                ['ACTION_WORDS', 'actionWords'],
                ['KEYWORD_ANCHORS', 'keywordAnchors'],
                ['BY_WORDS', 'byWords'],
                ['BY_LOOKAHEAD_WORDS', 'byLookaheadWords'],
                ['PLACE_PREFIXES', 'placePrefixes'],
                ['PLACE_SUFFIXES', 'placeSuffixes'],
                ['NEGATIVE_KEYWORDS', 'negativeKeywords'],
                ['EXCLUDE_TAIL_WORDS', 'excludeTailWords'],
                ['EXCLUDE_TAIL_PHRASES', 'excludeTailPhrases'],
                ['EXCLUDE_HEAD_WORDS', 'excludeHeadWords'],
                ['EXTRA_FEATURE_WORDS', 'extraFeatureWords'],
                ['NOTIFY_ONLY_PHRASES', 'notifyOnlyPhrases'],
        ]
        arrays.each { pair ->
            sb.append('    public static final String[] ' + pair[0] + ' = { ' + escArray(pair[1]) + ' };\n')
        }
        sb.append('}\n')

        def javaFile = rulesGenJavaDir.get()
                .file('io/github/okaidev/pickupcode/GeneratedRules.java').asFile
        javaFile.getParentFile().mkdirs()
        javaFile.setText(sb.toString(), 'UTF-8')

        def assetFile = rulesGenAssetsDir.get().file('rules/rules.json').asFile
        assetFile.getParentFile().mkdirs()
        assetFile.setText(raw, 'UTF-8')

        // 规则完整性摘要：随 APK 内置一份，用来校验「同版本号的规则集」有没有被替换。
        // 远端热更时 UpdateCenter 会做双镜像一致性校验，这里给的是「本地这份」的锚。
        def shaFile = rulesGenAssetsDir.get().file('rules/rules.sha256').asFile
        shaFile.getParentFile().mkdirs()
        shaFile.setText(digestSha256(raw) + '  rules.json\n', 'UTF-8')

        logger.lifecycle("generateRules: rules.json v${parsed.version} -> GeneratedRules.java + assets")
    }
}

/**
 * 规则的 SHA-256 摘要（纯 Gradle 实现，不依赖外部命令）。
 *
 * <p>为什么要算这个：热更规则是从 CDN 拉的，CDN 被劫持或内容损坏时，
 * 一份被改坏的规则可能让提取引擎失效、甚至把错误内容当取件码写进待办。
 * 有了摘要，App 至少能验证「拉到的东西和预期一致」。
 */
def digestSha256(String text) {
    def md = java.security.MessageDigest.getInstance('SHA-256')
    def bytes = md.digest(text.getBytes('UTF-8'))
    return bytes.collect { String.format('%02x', it & 0xff) }.join('')
}

android {
    namespace 'io.github.okaidev.pickupcode'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.okaidev.pickupcode'
        minSdk 28
        targetSdk 34
        versionCode pickupVersionCode
        versionName pickupVersionName
    }

    // 正式签名（v2.2.0）：仅当传入 -PPICKUP_KEYSTORE=... 时启用；CI / 无参数构建不受影响
    // 用法（密码走本地文件读入，勿提交、勿打印）：
    //   gradlew assembleRelease -PPICKUP_KEYSTORE=<path> -PPICKUP_KEYSTORE_PASS=<pass> -PPICKUP_KEY_ALIAS=pickupcode
    signingConfigs {
        if (project.hasProperty('PICKUP_KEYSTORE')) {
            release {
                storeFile file(PICKUP_KEYSTORE)
                storePassword PICKUP_KEYSTORE_PASS
                keyAlias PICKUP_KEY_ALIAS
                keyPassword PICKUP_KEYSTORE_PASS
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (project.hasProperty('PICKUP_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
            // 发布 APK 请使用你自己的签署配置（签名密钥不要提交到仓库！）：
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // 非标准源码布局，与 Termux 手工构建脚本保持一致
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src', rulesGenJavaDir]
            res.srcDirs = ['res']
            assets.srcDirs = ['assets', rulesGenAssetsDir]
        }
    }
}

dependencies {
    // 官方 Xposed API（仅编译期；运行时由 LSPosed 提供，不打包进 APK）
    compileOnly 'de.robv.android.xposed:api:82'

    // 4.0：本地取件库只运行在 App 进程；Hook 进程不引用 Room。
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
}

// 版本一致性校验：确保 version.properties 是唯一来源，且版本号格式合法。
tasks.register('checkVersionConsistency') {
    group = 'verification'
    description = 'Ensure version.properties is the only version source and Manifest has no stale versions.'
    doLast {
        def manifest = file('AndroidManifest.xml').getText('UTF-8')
        if (manifest.contains('android:versionCode') || manifest.contains('android:versionName')) {
            throw new GradleException('AndroidManifest.xml must not hardcode versionCode/versionName; use version.properties')
        }
        // 已发布的 3.1.0 是 versionCode 310；本版 4.0.2 = 402。
        // versionCode 必须单调递增——Android 靠它判定升级，规则集闸门也靠它。
        if (pickupVersionCode < 310) {
            throw new GradleException(
                    "versionCode ${pickupVersionCode} is lower than the published 3.1.0 (310)")
        }
        println "PickupCodeGrabber version: V${pickupVersionName} (versionCode ${pickupVersionCode})"
    }
}

tasks.configureEach { task ->
    if (task.name == 'preBuild') {
        task.dependsOn tasks.named('checkVersionConsistency')
        task.dependsOn tasks.named('generateRules')
    }
}
